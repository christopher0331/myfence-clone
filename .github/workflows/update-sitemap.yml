name: Validate Sitemap Generation

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/update-sitemap.yml'

jobs:
  validate-sitemap:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci

      - name: Build site (includes sitemap route)
        run: npm run build
